[package]
name = "timeloop"
version = "0.1.0"
edition = "2021"
authors = ["Timeloop Dev Team"]

[lib]
name = "timeloop"
path = "src/lib.rs"

[[bin]]
name = "timeloop"
path = "src/main.rs"

[dependencies]
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
